name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tmux: a handful of tests drive a real server (test_session_fixture.py).
      # bubblewrap: without it, sandbox/run.sh has no confinement mechanism
      # on Linux and the sandbox tests only ever exercise the refusal path.
      # Installing it means CI actually tests the Linux sandbox (gh#55).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      # Fail loudly and early if the test runner itself is missing, rather
      # than surfacing it as an ordinary test failure 15s in (gh#50).
      - name: Verify test runner is installed
        run: |
          python -m pytest --version

      - name: Run unit tests
        env:
          PYTHONPATH: src/clive
          # Several tests reach llm.get_client(), which constructs a real
          # SDK client object (no network — llm.chat is mocked). The
          # OpenAI SDK raises if api_key is None, so give it a dummy.
          # These passed locally only because the maintainer's shell had a
          # provider configured; CI has no ambient config, which is the
          # point of running here.
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: dummy-key-for-client-construction-only
        run: |
          python -m pytest tests/ -v --tb=short --timeout=120
